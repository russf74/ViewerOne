name: Build ViewerOne Windows

on:
  push:
    branches: [main, 'cursor/**']
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run icons
      - run: npm run build
      - run: npm run dist:dir
      - uses: actions/upload-artifact@v4
        with:
          name: ViewerOne-win-unpacked
          path: release/win-unpacked/
