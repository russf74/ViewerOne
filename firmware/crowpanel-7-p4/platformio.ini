; ViewerOne — ELECROW CrowPanel Advanced 7" ESP32-P4 (1024×600 MIPI DSI / EK79007 + GT911)
;
; Official PlatformIO espressif32 does NOT support ESP32-P4 Arduino.
; This project uses the community pioarduino platform (Arduino-ESP32 3.x / IDF 5.x).
;
;   python -m platformio run -e crowpanel-7-p4
;   python -m platformio run -e crowpanel-7-p4 -t upload --upload-port COMx
;
; CYD 2.8" firmware remains at ../esp32-display (untouched).

[platformio]
src_dir = src
default_envs = crowpanel-7-p4

[env:crowpanel-7-p4]
; pioarduino — ESP32-P4 Arduino support (pin a release if builds drift)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4-evboard
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.psram = enabled
lib_ldf_mode = deep+
lib_deps =
  https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
  https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3
  https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
  lvgl/lvgl@8.3.11
  bblanchon/ArduinoJson @ ^7.2.0
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -I include
  -D VIEWERONE_CROWPANEL_P4=1
build_src_filter =
  +<*>
  -<patterns.cpp>

; Optional: enable WS2812 on a free header GPIO (see README). FastLED/RMT on P4 is experimental.
[env:crowpanel-7-p4-led]
extends = env:crowpanel-7-p4
lib_deps =
  ${env:crowpanel-7-p4.lib_deps}
  fastled/FastLED @ ^3.9.0
build_flags =
  ${env:crowpanel-7-p4.build_flags}
  -D VIEWERONE_ENABLE_LED=1
build_src_filter =
  +<*>
  -<pattern_labels.cpp>
